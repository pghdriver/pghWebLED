<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="5; url=https://pghwebled.pghdriver.com/">
  <link rel="canonical" href="https://pghwebled.pghdriver.com/">
  <meta name="description" content="pghWebLED has moved. Open the new home of the browser-based WLED preview.">
  <title>pghWebLED has moved</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b0b0b; color: #f5f5f5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 580px); }
    .brand { margin: 0 0 30px; color: #ff8023; font-size: clamp(2.4rem, 9vw, 4rem); font-weight: 900; letter-spacing: -.055em; line-height: 1.1; }
    h1 { margin: 0 0 14px; font-size: clamp(1.8rem, 6vw, 2.5rem); line-height: 1.2; }
    p { line-height: 1.6; color: #bdbdbd; }
    .open { display: inline-flex; align-items: center; justify-content: center; min-height: 56px; margin: 16px 0; padding: 14px 24px; background: #ff8023; color: #141414; text-decoration: none; font-weight: 800; font-size: 1.1rem; }
    .open:hover { background: #ffa25b; }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }
    .address { display: block; width: fit-content; color: #ffad70; overflow-wrap: anywhere; text-underline-offset: 4px; }
    .countdown { font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <p class="brand">pghWebLED</p>
    <h1>We’ve moved!</h1>
    <p>The new home for pghWebLED is ready. Update your bookmark and come on over.</p>
    <a class="open" href="https://pghwebled.pghdriver.com/">Open pghWebLED &rarr;</a>
    <a class="address" href="https://pghwebled.pghdriver.com/">pghwebled.pghdriver.com</a>
    <p class="countdown">Opening automatically in <span id="seconds">5</span> seconds…</p>
  </main>
  <script>
    const startedAt = performance.now();
    const seconds = document.getElementById('seconds');
    const countdown = setInterval(() => {
      const remaining = Math.max(0, Math.ceil((5000 - (performance.now() - startedAt)) / 1000));
      seconds.textContent = String(remaining);
      if (remaining === 0) clearInterval(countdown);
    }, 200);
  </script>
</body>
</html>
